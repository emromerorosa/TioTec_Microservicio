spring.application.name=tiotec-tareas

# Base de datos H2 guardada en un archivo (los datos NO se borran al apagar el servidor)
spring.datasource.url=jdbc:h2:file:./data/tareasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea o actualiza la tabla "tarea" automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para ver la base de datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Muestra en la consola cada petición que llega (GET, POST, PUT, DELETE)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG